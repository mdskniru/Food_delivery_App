<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <meta
      name="description"
      content="Tripti — order food from local restaurants. Cash on delivery, live order tracking and partner dashboards."
    />
    <title>Tripti — Food Delivery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="site-header"></header>

    <main id="app"></main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <a class="brand" href="#/">
            <span class="brand-mark">T</span>
            <span class="brand-name">Tripti</span>
          </a>
          <p class="footer-copy">
            Fresh food from local kitchens, delivered to your door with cash on delivery.
          </p>
        </div>
        <nav class="footer-links" aria-label="Footer">
          <a href="#/">Menu</a>
          <a href="#/restaurant/login">Restaurant Owner</a>
          <a href="#/rider/login">Rider</a>
        </nav>
        <p class="footer-note">© 2026 Tripti · College project demo — data stays in your browser.</p>
      </div>
    </footer>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="app.js" defer></script>
  </body>
</html>
